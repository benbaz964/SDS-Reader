# Builds the Windows app on every push/PR, and publishes a GitHub Release
# (SDS-Reader.exe, portable zip, SHA256SUMS) when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Security notes:
#   - Every third-party action is pinned to a full commit SHA, so a
#     compromised/moved tag upstream can't change what runs here.
#   - The default token is read-only; only the release job gets write access,
#     and it only runs for tags, never for pull requests.
name: Build & release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = python -c "import sds_reader; print(sds_reader.__version__)"
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match sds_reader.__version__ ($v)" }

      - name: Build
        run: pyinstaller --noconfirm --clean build/sds_reader.spec

      - name: Self-test the built app
        shell: pwsh
        run: |
          foreach ($exe in "dist\SDS-Reader.exe", "dist\SDS-Reader\SDS-Reader.exe") {
            $out = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
            New-Item -ItemType Directory $out | Out-Null
            $p = Start-Process $exe -ArgumentList "--selftest", "`"$PWD\test_data\Acme_Solvent_X_SDS.pdf`"", "`"$out`"" -PassThru -Wait
            Get-Content "$out\selftest.txt"
            if ($p.ExitCode -ne 0) { throw "$exe self-test failed" }
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item dist\SDS-Reader.exe release\
          Compress-Archive -Path dist\SDS-Reader -DestinationPath release\SDS-Reader-portable.zip
          Copy-Item sds_reader\templates\default_summary_template.docx release\SDS-summary-template.docx
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Encoding ascii release\SHA256SUMS.txt
          Get-Content release\SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sds-reader-windows
          path: release/
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sds-reader-windows
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "SDS Reader ${{ github.ref_name }}" \
            --generate-notes
